name: ios-webwrap
on:
  workflow_dispatch:                   # a trial build by hand: an unsigned IPA of the web wrapper (a WKWebView around the website's WASM build)
    inputs:
      page_url:
        description: "page the wrapper opens"
        required: false
        default: "https://toontown.puffsco.com/play/?install=0"
permissions:
  contents: write
jobs:
  app:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            ios
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        env:
          PAGE_URL: ${{ inputs.page_url }}
        run: bash ios/webwrap/assemble.sh "$GITHUB_WORKSPACE"
      - name: Keep the IPA as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="webipa-${GITHUB_RUN_ID}"
          gh release create "$TAG" out/TTWeb.ipa --title "iOS web wrapper build $GITHUB_RUN_ID" --notes "Unsigned IPA (WKWebView around the web build) from run $GITHUB_RUN_ID." --prerelease
